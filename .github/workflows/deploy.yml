name: Build and Push

# Stage D3: quality gates + GHCR image publishing only. No SSH/deploy step
# exists yet — that lands in a later stage once explicitly requested.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: marketplace-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/almukhanbetov/marketplace-backend
  MIGRATE_IMAGE: ghcr.io/almukhanbetov/marketplace-migrate
  FRONTEND_IMAGE: ghcr.io/almukhanbetov/marketplace-frontend
  # Baked into the frontend bundle at build time (NEXT_PUBLIC_* vars are not
  # read at container runtime) — never localhost/127.0.0.1/10.0.2.2.
  NEXT_PUBLIC_API_URL: https://api.kungey-ayuly.kz/api/v1

jobs:
  backend-checks:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  frontend-checks:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run build
        # Only the real production API origin is used here — frontend/.env.local
        # (localhost, gitignored, never committed) plays no part in CI.
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
        run: npm run build

  build-and-push:
    name: Build and push GHCR images
    needs:
      - backend-checks
      - frontend-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (api target)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push migrate (migrate target)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
            ${{ env.MIGRATE_IMAGE }}:latest
          # Same cache scope as the api build above — the migrate target
          # shares the builder stage (go.mod download, source copy) with
          # api, so reusing the scope avoids rebuilding those layers twice.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
